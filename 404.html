  <script>

    if (!('onpagereveal' in window) && matchMedia('(prefers-reduced-motion: no-preference)').matches) {
      document.addEventListener('click', e => {
        const a = e.target.closest('a[href]');
        if (!a || e.defaultPrevented || e.button || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || a.target || a.hasAttribute('download')) return;
        const url = new URL(a.href, location.href);
        if (url.origin !== location.origin || (url.pathname === location.pathname && url.search === location.search)) return;
        e.preventDefault();
        document.documentElement.classList.add('page-leave');
        setTimeout(() => { location.href = url.href; }, 250);
      });
      // návrat tlačidlom Späť – stránka z pamäte sa ukáže hneď
      addEventListener('pageshow', e => { if (e.persisted) document.documentElement.classList.remove('page-leave'); });
    }
  </script>

      const pace = t => .6 * t + .4 * (.5 - Math.cos(Math.PI * t) / 2);
      const write = span => {
        const p = span.parentElement;
        // riadky textu sa zmerajú bez natočenia popisku (len na okamih, nič sa nevykreslí)
        const keep = p.style.transform;
        p.style.transform = 'none';
        const box = span.getBoundingClientRect();
        const range = document.createRange();
        range.selectNodeContents(span);
        const lines = [];
        for (const r of range.getClientRects()) {
          if (r.width < 1) continue;
          const l = lines.find(l => Math.abs(l.top - r.top) < r.height / 2);
          if (l) { l.x0 = Math.min(l.x0, r.left); l.x1 = Math.max(l.x1, r.right); }
          else lines.push({ top: r.top, x0: r.left, x1: r.right });
        }
        p.style.transform = keep;
        if (!lines.length) { p.classList.add('hand-done'); return; }
        lines.sort((a, b) => a.top - b.top);
        const W = box.width, H = box.height, S = 22, jump = 14; // S = mäkký hrot pera, jump = presun na ďalší riadok
        let c = 0;
        const parts = lines.map((l, i) => {
          const y = i ? l.top - box.top : 0, y2 = i < lines.length - 1 ? lines[i + 1].top - box.top : H;
          const part = { y, h: y2 - y, x0: l.x0 - box.left, len: l.x1 - l.x0 + S, at: c };
          c += part.len + jump;
          return part;
        });
        const D = c - jump;
        // tempo písania: ~65 ms na písmeno (celý popisok 0,7–2,4 s), pero ide stále rovnako rýchlo cez všetky riadky
        const T = Math.min(2400, Math.max(700, span.textContent.trim().length * 65));
        const set = (k, v) => { span.style[k] = v; span.style['webkit' + k[0].toUpperCase() + k.slice(1)] = v; };

        set('maskImage', parts.map(() => `linear-gradient(90deg, #000 ${W}px, transparent ${W + S}px)`).join(','));

        set('maskSize', parts.map(q => `${2 * W + S}px ${q.h}px`).join(','));

        const frame = now => {
          t0 ??= now;
          const t = Math.min(1, (now - t0) / T), d = pace(t) * D;
          set('maskPosition', parts.map(q => `${q.x0 + Math.min(q.len, Math.max(0, d - q.at)) - W - S}px ${q.y}px`).join(','));

          ['maskImage', 'maskRepeat', 'maskSize', 'maskPosition'].forEach(k => set(k, ''));
          p.classList.add('hand-done');
        };
        frame(performance.now()); // hneď skrytý presne podľa riadkov
        requestAnimationFrame(frame);
      };
      addEventListener('DOMContentLoaded', () => {
        window.handReady = true;
        const io = new IntersectionObserver(entries => entries.forEach(e => {
          if (!e.isIntersecting) return;
          io.unobserve(e.target);
          const p = e.target;
          // začne, keď sa popisok objaví (rešpektuje oneskorenie úvodu / objavovania pri scrollovaní)
          (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => requestAnimationFrame(() => {
            const d = parseFloat(p.style.getPropertyValue('--hero-delay') || p.style.getPropertyValue('--reveal-delay') || p.style.getPropertyValue('--d')) || 0;

        }), { threshold: .5 });
        document.querySelectorAll('.font-script').forEach(p => {
          const span = document.createElement('span');
          span.className = 'hand';
          span.append(...p.childNodes);
          p.append(span);
          p.classList.add('hand-ready');
          io.observe(p);
        });
      });
    })();
